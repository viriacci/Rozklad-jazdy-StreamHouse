name: Aktualizacja kalendarza streamów
run-name: "${{ github.event_name == 'schedule' && 'Kontrola cykliczna rozkładu' || inputs.dry_run && 'Podgląd rozkładu' || 'Publikacja rozkładu' }}"
on:
  schedule:
    - cron: "0 16 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      week:
        description: Tydzień
        type: choice
        options: [auto, current, next]
        default: auto
      dry_run:
        description: Tylko podgląd bez wysyłki
        type: boolean
        default: true
concurrency:
  group: stream-calendar
  cancel-in-progress: false
jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Wygeneruj i wyślij kalendarz
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEEK: ${{ inputs.week || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(--week "$WEEK")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python scripts/main.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: calendar-preview
          path: calendar.png
          if-no-files-found: ignore
      - name: Zapisz stan publikacji
        if: always() && !cancelled()
        run: |
          if [ ! -f state/publication.json ]; then exit 0; fi
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add state/publication.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update calendar publication [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

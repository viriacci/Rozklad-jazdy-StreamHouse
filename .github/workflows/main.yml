name: Aktualizacja kalendarza streamów

on:
  schedule:
    # Niedziela, 14:00 UTC = 16:00 PL (czas letni/DST) / 15:00 PL (czas zimowy)
    # Wysyła harmonogram NA NADCHODZĄCY tydzień (patrz fetch_sheet.py)
    - cron: "0 14 * * 0"
  push:
    branches: [main]
    paths: [".github/workflows/main.yml"]
  workflow_dispatch: {}  # pozwala odpalić ręcznie z zakładki Actions

concurrency:
  group: stream-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wygeneruj i wyślij kalendarz
        working-directory: .
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/main.py

      - name: Zapisz message_id.txt z powrotem do repo (jeśli się zmienił)
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add state/message_id.txt
          if git diff --cached --quiet; then
            echo "ID wiadomości bez zmian."
            exit 0
          fi
          git commit -m "chore: update message_id"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "::error::Nie udało się zapisać ID wiadomości po trzech próbach."
          exit 1
